[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpes"
version = "0.1.0"
description = "Differentially Private Evolution Strategies for prompt optimization"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Ziniu Liu"},
  {name = "Aiping Li"},
  {name = "Yue Han"},
  {name = "Han Yu"},
  {name = "Junjian Zhang"},
  {name = "Dong Zhu"},
  {name = "Changjian Li"},
  {name = "Shiqiang Zhang"},
]
dependencies = [
  "autodp>=0.2.3",
  "numpy>=1.23",
]

[project.urls]
Repository = "https://github.com/StephCpa/dp-es"

[tool.setuptools]
packages = ["dpes"]
